[project]
name = "importlens"
version = "0.1.0"
description = "Visualize python -X importtime output in a TUI"
readme = "README.md"
authors = [
    { name = "Kevin Turcios", email = "turcioskevinr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "textual>=8.0.0",
]

[project.scripts]
importlens = "importlens.__main__:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]
